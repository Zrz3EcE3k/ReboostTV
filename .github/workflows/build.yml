name: Build ReboostTV

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-pc-app:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Publish ReboostTV.exe (Release)
        run: |
          dotnet publish pc-app/ReboostTV.WinForms/ReboostTV.WinForms.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o publish/pc

      - name: Upload ReboostTV.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReboostTV-Windows
          path: publish/pc/ReboostTV.exe